# Variante para AUTOMAÇÃO (tools/automacao_original.py): usa a cópia re_trabalho/win31_auto, com o
# driver de mouse absoluto VBMOUSE.DRV (VBADOS) instalado, para que cliques do host caiam 1:1 na tela emulada.
# Para preparar a cópia, ver tests/referencias/README.md. Gerado a partir de dosbox-x.conf.
# Uso: referencia\rodar-original.bat (ou, a partir da pasta "Simant recomp":
#   referencia\dosbox-x\bin\x64\Release\dosbox-x.exe -conf referencia\dosbox-x.conf)
# A pasta SimAnt-T é montada como C: (o mesmo layout que AUTOEXEC.BAT/CONFIG.SYS esperam).
# Capturas (Ctrl+F5 no DOSBox-X) vão para tests/referencias/capturas.

[sdl]
output = opengl
autolock = false
windowresolution = original

[dosbox]
machine = svga_s3trio64
memsize = 32
captures = tests/referencias/capturas

[cpu]
core = normal
cputype = pentium
cycles = fixed 30000

[render]
aspect = true

[sblaster]
sbtype = sb16
sbbase = 220
irq = 7
dma = 1
hdma = 5
oplmode = auto

[midi]
mpu401 = intelligent
mididevice = default

[dos]
# o driver de mouse DOS será o VBMOUSE.EXE (VBADOS), que usa a interface VMware emulada para posição absoluta
int33 = false
# o SMARTDRV e os drivers SB16 do CONFIG.SYS original não são necessários no DOSBox-X
ver = 6.22

[autoexec]
mount c "re_trabalho\win31_auto"
c:
set PATH=C:\WINDOWS
set TEMP=C:\WINDOWS\TEMP
set BLASTER=A220 I7 D1 H5 P330 T6
C:\VBMOUSE.EXE
cd \WINDOWS
win C:\MAXIS\ANTWIN\SIMANTW.EXE
